<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LISTEN — Universal AI Chat</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            listen: {
              50: "#f5f3ff",
              100: "#ede9fe",
              500: "#7c3aed",
              600: "#6d28d9",
              700: "#5b21b6"
            }
          }
        }
      }
    };
  </script>

  <style>
    * {
      scrollbar-width: thin;
      scrollbar-color: #c4c4c4 transparent;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .message-content pre {
      overflow-x: auto;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      background: #111827;
      color: #f9fafb;
    }

    .message-content code {
      font-family: Consolas, Monaco, monospace;
    }

    .typing-dot {
      animation: typing 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .typing-dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes typing {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }

    .sidebar-transition {
      transition: transform 0.25s ease, width 0.25s ease;
    }
  </style>
</head>

<body class="bg-white text-gray-900 dark:bg-gray-950 dark:text-gray-100">

  <div class="flex h-screen overflow-hidden">

    <!-- ================= SIDEBAR ================= -->
    <aside
      id="sidebar"
      class="sidebar-transition fixed md:relative z-40 flex h-full w-72 -translate-x-full md:translate-x-0 flex-col border-r border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-gray-900"
    >

      <!-- Logo -->
      <div class="flex items-center justify-between px-5 py-5">
        <div class="flex items-center gap-3">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-listen-600 text-white shadow-lg"
          >
            ✦
          </div>

          <div>
            <h1 class="text-lg font-bold">LISTEN</h1>
            <p class="text-xs text-gray-500 dark:text-gray-400">
              Universal AI
            </p>
          </div>
        </div>

        <button
          id="closeSidebar"
          class="rounded-lg p-2 text-gray-500 hover:bg-gray-200 md:hidden dark:hover:bg-gray-800"
        >
          ✕
        </button>
      </div>

      <!-- New Chat -->
      <div class="px-4">
        <button
          id="newChatBtn"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-listen-600 px-4 py-3 font-medium text-white transition hover:bg-listen-700"
        >
          <span class="text-xl">＋</span>
          New Chat
        </button>
      </div>

      <!-- History -->
      <div class="mt-6 flex-1 overflow-y-auto px-3">
        <div class="mb-2 px-2 text-xs font-semibold uppercase tracking-wider text-gray-400">
          Recent Chats
        </div>

        <div id="historyList" class="space-y-1"></div>

        <div
          id="emptyHistory"
          class="px-3 py-8 text-center text-sm text-gray-400"
        >
          No conversations yet.
        </div>
      </div>

      <!-- Bottom -->
      <div class="border-t border-gray-200 p-3 dark:border-gray-800">

        <button
          id="settingsBtn"
          class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm hover:bg-gray-200 dark:hover:bg-gray-800"
        >
          <span>⚙️</span>
          Settings
        </button>

        <div class="mt-2 px-3 text-xs text-gray-400">
          Static AI Interface
        </div>
      </div>
    </aside>

    <!-- Overlay mobile -->
    <div
      id="sidebarOverlay"
      class="fixed inset-0 z-30 hidden bg-black/40 md:hidden"
    ></div>


    <!-- ================= MAIN ================= -->
    <main class="flex min-w-0 flex-1 flex-col">

      <!-- Header -->
      <header
        class="flex h-16 items-center justify-between border-b border-gray-200 px-4 dark:border-gray-800"
      >

        <div class="flex items-center gap-3">
          <button
            id="openSidebar"
            class="rounded-lg p-2 hover:bg-gray-100 md:hidden dark:hover:bg-gray-800"
          >
            ☰
          </button>

          <div>
            <h2 class="font-semibold">LISTEN</h2>
            <p
              id="modelDisplay"
              class="text-xs text-gray-500 dark:text-gray-400"
            >
              Universal AI
            </p>
          </div>
        </div>

        <button
          id="headerSettings"
          class="rounded-xl p-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800"
        >
          ⚙️
        </button>
      </header>


      <!-- ================= CHAT AREA ================= -->
      <section
        id="chatArea"
        class="flex-1 overflow-y-auto"
      >

        <!-- Welcome -->
        <div
          id="welcomeScreen"
          class="mx-auto flex min-h-full max-w-3xl flex-col items-center justify-center px-5 py-10 text-center"
        >

          <div
            class="mb-6 flex h-20 w-20 items-center justify-center rounded-3xl bg
